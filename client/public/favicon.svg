<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C4A31"/>
      <stop offset="100%" stop-color="#1B2E1E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4824A"/>
      <stop offset="100%" stop-color="#C4692A"/>
    </linearGradient>
  </defs>
  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3D6644" stroke-width="1.5"/>
  
  <!-- Circular 90-day trajectory track -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(245,240,232,0.18)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"
          stroke-dasharray="138" stroke-dashoffset="32" stroke-linecap="round"
          transform="rotate(-90 32 32)"/>
  
  <!-- Gold milestone indicator -->
  <circle cx="32" cy="10" r="2.5" fill="#B8914A"/>
  
  <!-- Number 90 in prominent clean serif -->
  <text x="32" y="38.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Georgia, serif" font-weight="800" font-size="21" fill="#FDFAF5" letter-spacing="-0.8px">90</text>
</svg>